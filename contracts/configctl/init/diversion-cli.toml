schemaVersion = 1
id = "diversion-cli"
kind = "diversion-cli"
description = "Install the official Diversion dv CLI"
enabled = true
risk = ["network", "mutable-user-state", "arbitrary-code"]
tags = ["diversion", "vcs", "developer-tools", "workstation"]

installer = "https://get.diversion.dev/unix"
bin = "$HOME/.diversion/bin/dv"

[state]
trackDesiredHash = true
trackObservedHash = true

[behavior]
install = true
update = false
prune = false
