model:
  provider: llm-local
  default: supervisor
  base_url: http://127.0.0.1:8080/v1

providers:
  llm-local:
    name: Dubnium Supervisor Gateway
    base_url: http://127.0.0.1:8080/v1
    default_model: supervisor
    transport: chat_completions
    models:
      supervisor:
        context_length: 65536

agent:
  max_turns: 90

display:
  personality: pragmatic
  show_reasoning: false
  streaming: true
