# Managed Kitty base configuration.
# source-of-truth: ryjen/dotfiles
#
# Preserve the effective Alacritty configuration across the terminal swap.
# Where Kitty defaults differ materially, pin the Alacritty-equivalent behavior here.

# Font faces: keep the same family, style variants, and size.
font_family family="Hack Nerd Font Mono" style=Regular
bold_font family="Hack Nerd Font Mono" style=Bold
italic_font family="Hack Nerd Font Mono" style=Italic
bold_italic_font family="Hack Nerd Font Mono" style="Bold Italic"
font_size 18.0

# Alacritty keeps 10,000 lines of scrollback and scrolls three lines per wheel tick.
scrollback_lines 10000
wheel_scroll_multiplier 3.0

# Match Alacritty's Base16 Classic Dark default palette.
foreground #d8d8d8
background #181818
color0  #181818
color1  #ac4242
color2  #90a959
color3  #f4bf75
color4  #6a9fb5
color5  #aa759f
color6  #75b5aa
color7  #d8d8d8
color8  #6b6b6b
color9  #c55555
color10 #aac474
color11 #feca88
color12 #82b8c8
color13 #c28cb8
color14 #93d3c3
color15 #f8f8f8
# Kitty models dim text as opacity rather than a separate dim palette; 0.6 is
# the closest single-value match to Alacritty's effective dim foreground/colors.
dim_opacity 0.6

# Alacritty uses reverse-video colors for both cursor and selection by default.
cursor none
cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0
selection_foreground none
selection_background none

# Do not inject Kitty-specific shell behavior into the existing Zsh setup.
shell_integration disabled
# Alacritty does not add Kitty's paste confirmation/URL rewriting layer.
paste_actions no-op
# Closing a terminal window did not require an extra terminal-level confirmation.
confirm_os_window_close 0

# Alacritty has no audible bell and its visual bell duration defaults to zero.
enable_audio_bell no
visual_bell_duration 0.0

# Alacritty copies selections to the system clipboard when save_to_clipboard=true.
copy_on_select clipboard

# Preserve the existing terminal ergonomics: Ctrl+V pastes directly.
map ctrl+v paste_from_clipboard
