name: Refresh ops-cadence lock

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: refresh-ops-cadence-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Refresh pinned input
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("flake.nix")
          content = path.read_text()
          old = 'url = "git+ssh://git@github.com/ryjen/ops-cadence.git?ref=main&rev=d83511cb669a6ca1481f7a79ea5f1aac6ceabd36";'
          new = 'url = "github:ryjen/ops-cadence?rev=200baa53de06dac26bd1b96c2ab2847ff4a79c1b";'
          if old in content:
              path.write_text(content.replace(old, new, 1))
          elif new not in content:
              raise SystemExit("unexpected ops-cadence input declaration")
          PY
          nix flake lock --update-input ops-cadence

      - name: Commit generated lock update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- flake.nix flake.lock; then
            echo "ops-cadence pin is already current"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock
          git commit -m "chore: refresh ops-cadence input"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
