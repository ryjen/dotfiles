name: Fix Hermes input formatting

on:
  push:
    branches:
      - perf/hermes-nixpkgs-follow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/hermes-nixpkgs-follow
          fetch-depth: 0

      - name: Normalize Hermes input block
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("flake.nix")
          text = path.read_text()
          current = '''    hermes-agent = {
    url = "github:NousResearch/hermes-agent";
    inputs.nixpkgs.follows = "nixpkgs";
  };'''
          target = '''    hermes-agent = {
      url = "github:NousResearch/hermes-agent";
      inputs.nixpkgs.follows = "nixpkgs";
    };'''
          if current not in text:
              raise SystemExit("unexpected Hermes input block")
          path.write_text(text.replace(current, target, 1))
          Path(".github/workflows/fix-hermes-format.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix .github/workflows/fix-hermes-format.yml
          git diff --cached --check
          git commit -m "style: normalize Hermes input block"
          git push origin HEAD:perf/hermes-nixpkgs-follow
