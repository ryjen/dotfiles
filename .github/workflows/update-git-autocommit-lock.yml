name: Update git-autocommit lock

on:
  push:
    branches:
      - agent/use-git-autocommit-flake

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/use-git-autocommit-flake
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Update lock entry
        run: nix flake lock --update-input git-autocommit
      - name: Commit lockfile
        run: |
          if git diff --quiet -- flake.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add flake.lock
          git commit -m "chore: lock git-autocommit input"
          git push
