name: Ops Cadence Module

on:
  pull_request:
    paths:
      - ".github/workflows/ops-cadence-module.yml"
      - "checks/verify-ops-cadence-timers.py"
      - "docs/ops-cadence-credential-isolation.md"
      - "home/ryjen/user.example.nix"
      - "modules/home/ops-cadence.nix"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ops-cadence-module.yml"
      - "checks/verify-ops-cadence-timers.py"
      - "docs/ops-cadence-credential-isolation.md"
      - "home/ryjen/user.example.nix"
      - "modules/home/ops-cadence.nix"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify timer invariants
        run: python3 checks/verify-ops-cadence-timers.py .
