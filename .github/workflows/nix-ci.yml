name: Nix CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify Workflow Security Policy
        run: python3 checks/verify-workflow-security.py .

      - name: Test Workflow Security Policy
        run: python3 -m unittest discover -s tests -p 'test_workflow_security.py'

      - name: Verify Standalone Source Boundary
        run: python3 checks/verify-standalone-source-boundary.py .

  discover-checks:
    needs: source-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      checks: ${{ steps.discover.outputs.checks }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17

      - name: Verify Generated Lockfile
        shell: bash
        run: |
          set -euo pipefail
          cp flake.lock flake.lock.committed
          nix flake lock
          if ! cmp -s flake.lock.committed flake.lock; then
            echo "flake.lock is not the Nix-generated lock for flake.nix" >&2
            git diff --no-index -- flake.lock.committed flake.lock || true
            exit 1
          fi
          rm flake.lock.committed

      - name: Discover Blocking Repository Checks
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          checks="$({
            nix eval --json .#checks.x86_64-linux \
              --apply 'checks: builtins.filter (name: name != "pre-commit-check") (builtins.attrNames checks)'
          })"

          if [ "$checks" = "[]" ]; then
            echo "No blocking repository checks were discovered" >&2
            exit 1
          fi

          echo "checks=$checks" >> "$GITHUB_OUTPUT"

  repository-check:
    name: repository-check (${{ matrix.check }})
    needs: discover-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.discover-checks.outputs.checks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17

      - name: Configure Cache
        uses: DeterminateSystems/flakehub-cache-action@146f476c94460cb634f9ade79470fcbc3f7e5b36 # v1

      - name: Build Repository Check
        shell: bash
        run: |
          set -o pipefail
          nix build ".#checks.x86_64-linux.\"${{ matrix.check }}\"" \
            --no-link \
            --print-build-logs 2>&1 | tee repository-check.log

      - name: Upload Failed Check Log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-check-${{ matrix.check }}
          path: repository-check.log
          if-no-files-found: error
          retention-days: 1

  pre-commit-baseline:
    name: pre-commit baseline (#115)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17

      - name: Configure Cache
        uses: DeterminateSystems/flakehub-cache-action@146f476c94460cb634f9ade79470fcbc3f7e5b36 # v1

      - name: Measure Legacy Pre-commit Debt
        id: baseline
        shell: bash
        run: |
          set +e
          set -o pipefail
          nix build '.#checks.x86_64-linux."pre-commit-check"' \
            --no-link \
            --print-build-logs 2>&1 | tee pre-commit-baseline.log
          status="${PIPESTATUS[0]}"
          echo "status=$status" >> "$GITHUB_OUTPUT"

          if [ "$status" -ne 0 ]; then
            echo "::warning title=Legacy pre-commit debt::pre-commit-check remains non-gating under issue #115; see the uploaded baseline log"
          else
            echo "pre-commit-check is clean; issue #115 can restore it to the blocking matrix"
          fi

      - name: Upload Baseline Log
        if: steps.baseline.outputs.status != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pre-commit-baseline
          path: pre-commit-baseline.log
          if-no-files-found: error
          retention-days: 1

  flake:
    needs: repository-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17

      - name: Configure Cache
        uses: DeterminateSystems/flakehub-cache-action@146f476c94460cb634f9ade79470fcbc3f7e5b36 # v1

      - name: Validate Flake Metadata
        run: nix flake metadata --no-write-lock-file

      - name: Evaluate Home Manager profile — nixos
        shell: bash
        run: |
          set -o pipefail
          nix eval --show-trace --raw '.#homeConfigurations."ryjen@nixos".activationPackage.drvPath' \
            2>&1 | tee profile-nixos-eval.log

      - name: Upload Failed Profile Evaluation Log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-nixos-eval
          path: profile-nixos-eval.log
          if-no-files-found: error
          retention-days: 1

      - name: Evaluate Home Manager profile — verify
        run: nix eval --raw '.#homeConfigurations."ryjen@verify".activationPackage.drvPath' >/dev/null

      - name: Evaluate Home Manager profile — headless
        run: nix eval --raw '.#homeConfigurations."ryjen@headless".activationPackage.drvPath' >/dev/null

      - name: Evaluate Home Manager profile — wsl
        run: nix eval --raw '.#homeConfigurations."ryjen@wsl".activationPackage.drvPath' >/dev/null

      - name: Evaluate Home Manager profile — dubnium
        run: nix eval --raw '.#homeConfigurations."ryjen@dubnium".activationPackage.drvPath' >/dev/null

      - name: Evaluate Home Manager profile — technetium
        run: nix eval --raw '.#homeConfigurations."ryjen@technetium".activationPackage.drvPath' >/dev/null

      - name: Evaluate Home Manager profile — meeting-verify
        run: nix eval --raw '.#homeConfigurations."ryjen@meeting-verify".activationPackage.drvPath' >/dev/null

      - name: Evaluate Home Manager profile — unreal-verify
        run: nix eval --raw '.#homeConfigurations."ryjen@unreal-verify".activationPackage.drvPath' >/dev/null

      - name: Build Enabled Unreal Configuration
        run: |
          nix build '.#homeConfigurations."ryjen@unreal-verify".activationPackage' \
            --no-link \
            --print-build-logs

      - name: Build OpenWork Package
        run: nix build .#openwork --print-build-logs

      - name: Build Home Manager Activation
        run: nix build .#homeConfigurations.ryjen@verify.activationPackage --print-build-logs

      - name: Build Dubnium Home Manager Activation
        run: |
          nix build '.#homeConfigurations."ryjen@dubnium".activationPackage' \
            --no-link \
            --print-build-logs

      - name: Build NixOS System
        run: nix build .#nixosConfigurations.verify.config.system.build.toplevel --print-build-logs
