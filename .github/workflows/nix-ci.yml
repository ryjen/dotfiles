name: Nix CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Configure Cache
        uses: DeterminateSystems/flakehub-cache-action@v1

      - name: Flake Check
        run: |
          set -o pipefail
          nix flake check --no-build 2>&1 | tee flake-check.log

      - name: Upload Flake Check Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flake-check-log
          path: flake-check.log

      - name: Build Home Manager Activation
        run: nix build .#homeConfigurations.ryjen@verify.activationPackage

      - name: Build NixOS System
        run: nix build .#nixosConfigurations.verify.config.system.build.toplevel
