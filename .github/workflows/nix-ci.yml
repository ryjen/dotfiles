name: Nix CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17

      - name: Configure Cache
        uses: DeterminateSystems/flakehub-cache-action@v1

      - name: Diagnose Flake Inputs
        run: |
          nix --version
          nix flake metadata --json | jq .
          nix flake archive --json | jq .
          nix path-info /nix/store/6b2ym9rs3dsniij8gs20d3qp2bwqj9z6-source || true
          nix eval --show-trace .#nixosConfigurations.nixos.config.system.build.toplevel.drvPath

      - name: Flake Check
        run: nix flake check --no-build

      - name: Build Home Manager Activation
        run: nix build .#homeConfigurations.ryjen@verify.activationPackage

      - name: Build NixOS System
        run: nix build .#nixosConfigurations.verify.config.system.build.toplevel
