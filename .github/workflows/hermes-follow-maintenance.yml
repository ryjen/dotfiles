name: Finalize Hermes nixpkgs follow

on:
  push:
    branches:
      - perf/hermes-nixpkgs-follow

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/hermes-nixpkgs-follow
          fetch-depth: 0

      - name: Normalize and remove maintenance workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("flake.nix")
          text = path.read_text()
          old = '''    hermes-agent = {
            url = "github:NousResearch/hermes-agent";
            inputs.nixpkgs.follows = "nixpkgs";
          };'''
          old_unformatted = '''    hermes-agent = {
          url = "github:NousResearch/hermes-agent";
          inputs.nixpkgs.follows = "nixpkgs";
        };'''
          bad = '''    hermes-agent = {
        url = "github:NousResearch/hermes-agent";
        inputs.nixpkgs.follows = "nixpkgs";
      };'''
          target = '''    hermes-agent = {
      url = "github:NousResearch/hermes-agent";
      inputs.nixpkgs.follows = "nixpkgs";
    };'''
          if target not in text:
              if bad in text:
                  text = text.replace(bad, target, 1)
              elif old_unformatted in text:
                  text = text.replace(old_unformatted, target, 1)
              elif old in text:
                  text = text.replace(old, target, 1)
              else:
                  raise SystemExit("Hermes input block not found")
          path.write_text(text)
          Path(".github/workflows/hermes-follow-maintenance.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock .github/workflows/hermes-follow-maintenance.yml
          git diff --cached --check
          git commit -m "chore: finalize Hermes nixpkgs follow"
          git push origin HEAD:perf/hermes-nixpkgs-follow
